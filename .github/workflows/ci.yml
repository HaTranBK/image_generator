name: CI & SonarCloud Analysis

on:
  push:
    branches:
      - main
      - ha_dev
  pull_request:
    branches:
      - main
      - ha_dev
    types: [opened, synchronize, reopened]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/book_illustration"
      JWT_SECRET: "bachkhoa"
      GEMINI_API_KEY: "dummy-key-for-ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate

      - name: Run Lint
        run: |
          cd backend
          npm run lint

      - name: Run Tests with Coverage
        run: |
          cd backend
          npm run test:cov

      # Save coverage artifact for SonarCloud scanner job
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Lint
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build

  sonarcloud:
    name: SonarCloud Scan
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # Download the coverage report to combine it with the scan
      - name: Download backend coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Unique token automatically provided by GitHub
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Generated on SonarCloud and stored in GitHub Secrets
